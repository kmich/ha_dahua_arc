# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.14 and HA 2026.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q custom_components/dahua_arc tests
      - name: Ruff lint
        run: ruff check custom_components/dahua_arc tests scripts
      - name: Ruff format
        run: ruff format --check custom_components/dahua_arc tests scripts
      - name: Security lint
        # Legacy DHIP requires MD5 challenge response; transport cleanup exceptions
        # are best-effort. Assert is intentional in packaging validation.
        run: ruff check --select S --ignore S101,S110,S324 custom_components/dahua_arc scripts
      - name: Protocol and area unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin tests/test_state_engine.py tests/test_area_assignment.py
      - name: Home Assistant runtime and config flow tests
        run: python -m pytest tests/ha --cov=custom_components/dahua_arc --cov-report=term-missing
      - name: Package integrity
        run: python scripts/check_package.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # 2026-09-21

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
