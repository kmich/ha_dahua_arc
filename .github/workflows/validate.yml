name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Reused by the release workflow so a release runs exactly these checks.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate (defaults to the triggering ref)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: Python 3.14 and HA 2026.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q custom_components/dahua_arc tests
      - name: Ruff lint (including security and async rules)
        run: ruff check custom_components/dahua_arc tests scripts
      - name: Ruff format
        run: ruff format --check custom_components/dahua_arc tests scripts
      - name: Tests with coverage floor
        # Protocol, fake-ARC end-to-end, HA runtime/config-flow tests. The
        # coverage floor lives in pyproject.toml.
        run: python -m pytest --cov --cov-report=term-missing
      - name: Package integrity
        run: python scripts/check_package.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # 2026-09-21

  hacs:
    name: HACS validation (public repositories only)
    # HACS does not support private GitHub repositories. The action cannot read
    # their integration manifests, even with a repository-scoped Actions token.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
