[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components/dahua_arc", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # reverse-engineering diagnostics include long RPC method names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
